name: Bug report
description: Something did not work, or the result looks wrong.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please check the [troubleshooting guide](https://github.com/faramarz/crossword-poster/blob/main/docs/TROUBLESHOOTING.md) first.

        **Please do not paste real or private clues, names or answers.** Made-up lines that cause the same problem are enough.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see? Include any error message exactly as it appeared.
      placeholder: "I ran the build and it stopped with ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      description: Copy the exact command, including all options.
      render: shell
      placeholder: crossword-poster build --clues my_clues.csv --title "Example" --size 24x36 --out poster
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `crossword-poster doctor`
      description: Run `crossword-poster doctor` and paste everything it prints. If that command does not work, say so and paste the error.
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other (please say which)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: "macOS 15.1, Windows 11, Ubuntu 24.04 ..."
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - pip in a virtual environment
        - pipx
        - uv
        - From source (pip install -e)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: A small clues file that shows the problem (optional)
      description: Only made-up clues, please. A few rows is enough.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, what you already tried, or the output with `CROSSWORD_POSTER_DEBUG=1` set.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real names, clues and other private details from this report.
          required: true
