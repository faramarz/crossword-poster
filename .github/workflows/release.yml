name: Release

# Push a tag such as v1.0.0 to build the sdist and wheel and attach them to a GitHub Release.
# The notes come from the matching section of CHANGELOG.md. Nothing is uploaded to a package index.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and create the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # only this job may create the Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - name: The tag must match the package version
        run: |
          version="$(python -c 'import crossword_poster; print(crossword_poster.__version__)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match crossword_poster.__version__ ($version)" >&2
            exit 1
          fi
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Take the release notes from CHANGELOG.md
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "crossword-poster ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
