name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a new push cancels the older run of the same pull request, but never a run on main
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip "ruff>=0.16,<0.17"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m "not e2e"

  e2e:
    name: End-to-end (real Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: crossword-poster install-browser --with-deps
      - run: crossword-poster doctor
      - run: python -m pytest -m e2e
      - name: Build the sample poster
        run: crossword-poster sample --out sample-out --size 24x36
      - name: Upload the PDFs and PNGs
        uses: actions/upload-artifact@v4
        with:
          name: sample-poster
          path: |
            sample-out/*.pdf
            sample-out/*.png
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: crossword-poster install-browser
      - run: crossword-poster doctor
      - run: python -m pytest -m "not e2e"
      - name: Build the sample poster end to end
        run: crossword-poster sample --out sample-out --size 18x24
      - name: Check the files were written
        shell: python
        run: |
          import pathlib
          out = pathlib.Path("sample-out")
          for name in ("poster_18x24_grey_bleed.pdf", "poster_18x24_grey_preview.png", "answer_sheet_letter.pdf"):
              path = out / name
              assert path.stat().st_size > 10_000, f"{name} is missing or too small"
          print("sample build wrote", len(list(out.glob("*.pdf"))), "PDFs")

  package:
    name: Build the package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: The wheel installs and runs in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/crossword-poster --version
          /tmp/clean/bin/crossword-poster template /tmp/clean/clues.csv
      - name: The unit tests pass from the source distribution
        run: |
          mkdir /tmp/sdist
          tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist
          python -m pip install ".[dev]"
          python -m pytest -m "not e2e"
