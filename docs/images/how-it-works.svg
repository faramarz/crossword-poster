<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="t d">
<title id="t">How crossword-poster works</title>
<desc id="d">Your clues go into a grid builder, then checks, then layout and fit, which produces the print files: a poster PDF with bleed, a trim PDF, an answer sheet and an actual-size check page.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
<rect x="3" y="3" width="894" height="444" rx="18" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<text x="36" y="46" font-size="18" font-weight="700" fill="#111827" text-anchor="start"><tspan x="36" dy="0">From a spreadsheet to a poster you can hang on a wall</tspan></text>
<rect x="36" y="70" width="180" height="112" rx="12" fill="#dbeafe" stroke="#111827" stroke-width="1.5"/>
<circle cx="60" cy="96" r="12" fill="#111827"/>
<text x="60" y="101" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="60" dy="0">1</tspan></text>
<text x="80" y="101" font-size="16" font-weight="700" fill="#111827" text-anchor="start"><tspan x="80" dy="0">Your clues</tspan></text>
<text x="52" y="130" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="52" dy="0">A spreadsheet with a</tspan><tspan x="52" dy="18">clue column and an</tspan><tspan x="52" dy="18">answer column</tspan></text>
<line x1="220" y1="126.0" x2="249" y2="126.0" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<rect x="252" y="70" width="180" height="112" rx="12" fill="#dcfce7" stroke="#111827" stroke-width="1.5"/>
<circle cx="276" cy="96" r="12" fill="#111827"/>
<text x="276" y="101" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="276" dy="0">2</tspan></text>
<text x="296" y="101" font-size="16" font-weight="700" fill="#111827" text-anchor="start"><tspan x="296" dy="0">Grid builder</tspan></text>
<text x="268" y="130" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="268" dy="0">Fits every answer</tspan><tspan x="268" dy="18">into one connected</tspan><tspan x="268" dy="18">crossword grid</tspan></text>
<line x1="436" y1="126.0" x2="465" y2="126.0" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<rect x="468" y="70" width="180" height="112" rx="12" fill="#fef3c7" stroke="#111827" stroke-width="1.5"/>
<circle cx="492" cy="96" r="12" fill="#111827"/>
<text x="492" y="101" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="492" dy="0">3</tspan></text>
<text x="512" y="101" font-size="16" font-weight="700" fill="#111827" text-anchor="start"><tspan x="512" dy="0">Checks</tspan></text>
<text x="484" y="130" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="484" dy="0">A validator re-reads</tspan><tspan x="484" dy="18">the grid letter by</tspan><tspan x="484" dy="18">letter (no slips)</tspan></text>
<line x1="652" y1="126.0" x2="681" y2="126.0" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<rect x="684" y="70" width="180" height="112" rx="12" fill="#fce7f3" stroke="#111827" stroke-width="1.5"/>
<circle cx="708" cy="96" r="12" fill="#111827"/>
<text x="708" y="101" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="708" dy="0">4</tspan></text>
<text x="728" y="101" font-size="16" font-weight="700" fill="#111827" text-anchor="start"><tspan x="728" dy="0">Layout &amp; fit</tspan></text>
<text x="700" y="130" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="700" dy="0">Finds the largest</tspan><tspan x="700" dy="18">squares that still</tspan><tspan x="700" dy="18">keep clues readable</tspan></text>
<line x1="774" y1="182" x2="774" y2="246" stroke="#111827" stroke-width="2"/>
<line x1="120" y1="246" x2="774" y2="246" stroke="#111827" stroke-width="2"/>
<rect x="710" y="196" width="128" height="30" rx="15" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<text x="774" y="216" font-size="14" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="774" dy="0">5  Print files</tspan></text>
<line x1="120" y1="246" x2="120" y2="279" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<rect x="21" y="282" width="198" height="118" rx="12" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/>
<text x="37" y="312" font-size="15" font-weight="700" fill="#111827" text-anchor="start"><tspan x="37" dy="0">Poster PDF</tspan></text>
<text x="37" y="338" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="37" dy="0">With 0.125 in bleed.</tspan><tspan x="37" dy="18">Send this one to</tspan><tspan x="37" dy="18">the print shop.</tspan></text>
<line x1="338" y1="246" x2="338" y2="279" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<rect x="239" y="282" width="198" height="118" rx="12" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/>
<text x="255" y="312" font-size="15" font-weight="700" fill="#111827" text-anchor="start"><tspan x="255" dy="0">Trim PDF</tspan></text>
<text x="255" y="338" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="255" dy="0">Exact final size, for</tspan><tspan x="255" dy="18">shops that add their</tspan><tspan x="255" dy="18">own bleed.</tspan></text>
<line x1="556" y1="246" x2="556" y2="279" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<rect x="457" y="282" width="198" height="118" rx="12" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/>
<text x="473" y="312" font-size="15" font-weight="700" fill="#111827" text-anchor="start"><tspan x="473" dy="0">Answer sheet</tspan></text>
<text x="473" y="338" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="473" dy="0">The filled grid on a</tspan><tspan x="473" dy="18">letter page, plus an</tspan><tspan x="473" dy="18">11x17 key for the host.</tspan></text>
<line x1="774" y1="246" x2="774" y2="279" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<rect x="675" y="282" width="198" height="118" rx="12" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/>
<text x="691" y="312" font-size="15" font-weight="700" fill="#111827" text-anchor="start"><tspan x="691" dy="0">Actual-size check</tspan></text>
<text x="691" y="338" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="691" dy="0">Print it at 100% to</tspan><tspan x="691" dy="18">judge the squares and</tspan><tspan x="691" dy="18">the type first.</tspan></text>
<text x="450" y="428" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle"><tspan x="450" dy="0">Everything runs on your own computer. The same clues and seed always give the same poster.</tspan></text>
</svg>
